name: test

on:
  push:
  pull_request:
  # Weekly, so a new Nix release that breaks the installer is caught before
  # users hit it (the script always installs the latest release).
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned image rather than the runner's shellcheck, so results match
      # local runs: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 ...
      - run: docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.11.0 -s sh install.sh chinera-nix-install.sh tests/run.sh

  chimera:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [daemon, single, uninstall, reinstall-guard, legacy-readme, migrate, bad-version]
    steps:
      - uses: actions/checkout@v4
      - run: tests/run.sh ${{ matrix.scenario }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.scenario }}
          path: /tmp/nix-chimera-tests.*/
